<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#132d35" />
    <meta name="color-scheme" content="light dark" />
    <!-- Tema antes de pintar (sin parpadeo): preferencia guardada o la del sistema. Solo guarda «claro» u «oscuro». -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('arcomunity-tema') } catch (e) {}
        var oscuro = t === 'oscuro' || (t !== 'claro' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light')
        if (oscuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d1d22')
      })()
    </script>
    <meta name="description" content="Demo frontend de gestión transparente de cuotas vecinales Arcomunity" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Arcomunity · Cuotas vecinales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
